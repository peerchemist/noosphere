include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - macos/**
    - linux/**
    # This manifest resolves paths relative to /workspace inside the image.
    - deploy/coordinator/pubspec.yaml

linter:
  rules:
    avoid_print: true
    directives_ordering: true
    prefer_final_locals: true
    unawaited_futures: true
