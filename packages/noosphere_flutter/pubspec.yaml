name: noosphere_flutter
description: Flutter isolate-worker facade for Noosphere ROAST signers and embedded coordinators.
version: 0.4.0
repository: https://github.com/peercoin/noosphere_roast_flutter

platforms:
  linux:
  macos:

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  coinlib: 6.0.1
  flutter:
    sdk: flutter
  frosty:
    git:
      url: https://github.com/peerchemist/frosty.git
      ref: 5.1.0
  iroh_flutter: 1.2.0
  meta: ^1.18.0
  noosphere_protocol: ^0.4.0
  noosphere_client: '>=4.0.0 <5.0.0'
  noosphere_server: '>=3.0.0 <4.0.0'
  record_use: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.26.0

flutter:
  uses-material-design: false
