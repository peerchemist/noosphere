// Canonical wire messages for the Noosphere protocol.
syntax = "proto3";
package noosphere;

message Bytes {
  bytes data = 1;
}

message RepeatedBytes {
  repeated bytes data = 1;
}

enum SignaturesResponseType {
  SIGNATURES_RESPONSE_EMPTY = 0;
  SIGNATURES_RESPONSE_NEW_ROUND = 1;
  SIGNATURES_RESPONSE_COMPLETE = 2;
}

message SignaturesResponse {
  SignaturesResponseType type = 1;
  bytes data = 2;
}

message Empty {}

message LoginRequest {
  bytes group_fingerprint = 1;
  bytes participant_id = 2;
  uint32 protocol_version = 3;
}

message SignedAuthChallenge {
  bytes signature = 1;
  bytes challenge = 2;
}

message DkgRequest {
  bytes sid = 1;
  bytes signed_details = 2;
  bytes commitment = 3;
}

message DkgToReject {
  bytes sid = 1;
  string name = 2;
}

message DkgCommitment {
  bytes sid = 1;
  string name = 2;
  bytes commitment = 3;
}

message DkgSecret {
  bytes id = 1;
  bytes secret = 2;
}

message DkgRound2 {
  bytes sid = 1;
  string name = 2;
  bytes commitment_set_signature = 3;
  repeated DkgSecret secrets = 4;
}

message DkgAcks {
  bytes sid = 1;
  repeated bytes acks = 2;
}

message DkgAckRequest {
  bytes sid = 1;
  repeated bytes requests = 2;
}

message SignaturesRequest {
  bytes sid = 1;
  repeated bytes keys = 2;
  bytes signed_details = 3;
  repeated bytes commitments = 4;
}

message SignaturesRejection {
  bytes sid = 1;
  bytes req_id = 2;
}

message SignaturesReplies {
  bytes sid = 1;
  bytes req_id = 2;
  repeated bytes replies = 3;
}

message EncryptedSecret {
  bytes id = 1;
  bytes share = 2;
}

message SecretShare {
  bytes sid = 1;
  bytes group_key = 2;
  repeated EncryptedSecret secrets = 3;
}

message ConstructedKey {
  bytes sid = 1;
  bytes constructed_key = 2;
}

enum EventType {
  PARTICIPANT_STATUS_EVENT = 0;
  NEW_DKG_EVENT = 1;
  DKG_COMMITMENT_EVENT = 2;
  DKG_REJECT_EVENT = 3;
  DKG_ROUND2_SHARE_EVENT = 4;
  DKG_ACK_EVENT = 5;
  DKG_ACK_REQUEST_EVENT = 6;
  SIG_REQ_EVENT = 7;
  SIG_NEW_ROUNDS_EVENT = 8;
  SIG_COMPLETE_EVENT = 9;
  SIG_FAILURE_EVENT = 10;
  KEEPALIVE_EVENT = 11;
  SECRET_SHARE_EVENT = 12;
  CONSTRUCTED_KEY_EVENT = 13;
}

message Events {
  EventType type = 1;
  bytes data = 2;
}

enum ProtocolErrorCode {
  PROTOCOL_ERROR_UNSPECIFIED = 0;
  PROTOCOL_ERROR_INVALID_REQUEST = 1;
  PROTOCOL_ERROR_UNAUTHENTICATED = 2;
  PROTOCOL_ERROR_UNSUPPORTED_VERSION = 3;
  PROTOCOL_ERROR_RESOURCE_EXHAUSTED = 4;
  PROTOCOL_ERROR_DEADLINE_EXCEEDED = 5;
  PROTOCOL_ERROR_INTERNAL = 6;
  PROTOCOL_ERROR_UNKNOWN_OUTCOME = 7;
  PROTOCOL_ERROR_SESSION_NOT_FOUND = 8;
  PROTOCOL_ERROR_SESSION_EXPIRED = 9;
}

message ProtocolError {
  ProtocolErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  // RoomFailureCode index when enrollment fails with a room-domain error.
  // Presence matters: unknownRoom has index zero.
  optional uint32 room_failure_code = 4;
}

// Successful result for operations which intentionally return no value.
message EmptySuccess {}

message LoginResponse {
  // Serialized ExpirableAuthChallengeResponse domain object.
  bytes challenge = 1;
}

message RespondToChallengeResponse {
  // Authentication succeeded; StartSession follows on the session stream.
  EmptySuccess authenticated = 1;
}

message ExtendSessionResponse {
  // Serialized Expiry domain object.
  bytes expiry = 1;
}

message RequestNewDkgResponse {
  EmptySuccess success = 1;
}

message RejectDkgResponse {
  EmptySuccess success = 1;
}

message SubmitDkgCommitmentResponse {
  EmptySuccess success = 1;
}

message SubmitDkgRound2Response {
  EmptySuccess success = 1;
}

message SendDkgAcksResponse {
  EmptySuccess success = 1;
}

message RequestDkgAcksResponse {
  repeated bytes acks = 1;
}

message RequestSignaturesResponse {
  EmptySuccess success = 1;
}

message RejectSignaturesRequestResponse {
  EmptySuccess success = 1;
}

message NoSignatureUpdate {}

message NewSignatureRound {
  bytes data = 1;
}

message CompletedSignatures {
  bytes data = 1;
}

message SubmitSignatureRepliesResponse {
  oneof outcome {
    NoSignatureUpdate no_update = 1;
    NewSignatureRound new_round = 2;
    CompletedSignatures completed = 3;
  }
}

message ShareSecretShareResponse {
  // Serialized ConstructedKeyEvent domain objects.
  repeated bytes constructed_key_events = 1;
}

message AckKeyConstructedResponse {
  EmptySuccess success = 1;
}

message BeginEnrollmentRequest {
  // Canonically serialized RoomInvite, including its enrollment version.
  bytes invite = 1;
  // Compressed secp256k1 public key (33 bytes).
  bytes participant_public_key = 2;
}

message BeginEnrollmentResponse {
  // Canonically serialized EnrollmentChallenge.
  bytes challenge = 1;
}

message RedeemRoomInviteRequest {
  // Canonically serialized EnrollmentTranscript; these exact bytes are signed.
  bytes transcript = 1;
  // Schnorr signature (64 bytes).
  bytes signature = 2;
}

message RedeemRoomInviteResponse {
  // Canonically serialized RoomSnapshot.
  bytes snapshot = 1;
}

message RpcRequest {
  // Opaque, non-empty correlation identifier generated for each RPC.
  bytes request_id = 1;

  oneof request {
    LoginRequest login = 10;
    SignedAuthChallenge respond_to_challenge = 11;
    Bytes extend_session = 12;
    DkgRequest request_new_dkg = 13;
    DkgToReject reject_dkg = 14;
    DkgCommitment submit_dkg_commitment = 15;
    DkgRound2 submit_dkg_round2 = 16;
    DkgAcks send_dkg_acks = 17;
    DkgAckRequest request_dkg_acks = 18;
    SignaturesRequest request_signatures = 19;
    SignaturesRejection reject_signatures_request = 20;
    SignaturesReplies submit_signature_replies = 21;
    SecretShare share_secret_share = 22;
    ConstructedKey ack_key_constructed = 23;
    BeginEnrollmentRequest begin_enrollment = 24;
    RedeemRoomInviteRequest redeem_room_invite = 25;
  }
}

message RpcResponse {
  bytes request_id = 1;

  oneof response {
    LoginResponse login = 10;
    RespondToChallengeResponse respond_to_challenge = 11;
    ExtendSessionResponse extend_session = 12;
    RequestNewDkgResponse request_new_dkg = 13;
    RejectDkgResponse reject_dkg = 14;
    SubmitDkgCommitmentResponse submit_dkg_commitment = 15;
    SubmitDkgRound2Response submit_dkg_round2 = 16;
    SendDkgAcksResponse send_dkg_acks = 17;
    RequestDkgAcksResponse request_dkg_acks = 18;
    RequestSignaturesResponse request_signatures = 19;
    RejectSignaturesRequestResponse reject_signatures_request = 20;
    SubmitSignatureRepliesResponse submit_signature_replies = 21;
    ShareSecretShareResponse share_secret_share = 22;
    AckKeyConstructedResponse ack_key_constructed = 23;
    BeginEnrollmentResponse begin_enrollment = 24;
    RedeemRoomInviteResponse redeem_room_invite = 25;
    ProtocolError error = 100;
  }
}

message StartSession {}

message SessionStarted {
  bytes session_id = 1;
  // Serialized LoginCompleteResponse domain snapshot.
  bytes snapshot = 2;
}

message Ready {}

message Logout {
  bytes session_id = 1;
}

message Envelope {
  // Envelope wire version. This is independent of LoginRequest.protocol_version.
  uint32 wire_version = 1;

  oneof payload {
    RpcRequest rpc_request = 10;
    RpcResponse rpc_response = 11;
    StartSession start_session = 20;
    SessionStarted session_started = 21;
    Ready ready = 25;
    Logout logout = 27;
    Events event = 28;
    ProtocolError error = 29;
  }
}
