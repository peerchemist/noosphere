name: CI

on:
  pull_request:
  push:
    tags: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and library tests
    uses: ./.github/workflows/ci-quality.yaml
    with:
      flutter_version: 3.47.0

  integration:
    name: Native integration
    uses: ./.github/workflows/ci-integration.yaml
    with:
      flutter_version: 3.47.0

  distribution:
    name: Distribution validation
    uses: ./.github/workflows/ci-distribution.yaml
    with:
      flutter_version: 3.47.0

  summary:
    name: CI summary
    if: always()
    needs: [quality, integration, distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write job summary
        run: |
          {
            echo '## Noosphere CI'
            echo '| Suite | Result |'
            echo '| --- | --- |'
            echo '| Formatting and dependencies | ${{ needs.quality.outputs.formatting_result }} |'
            echo '| Protocol and CBOR vectors | ${{ needs.quality.outputs.protocol_result }} |'
            echo '| Client and server core | ${{ needs.quality.outputs.core_result }} |'
            echo '| Flutter facade | ${{ needs.quality.outputs.flutter_result }} |'
            echo '| Native integration shards | ${{ needs.integration.outputs.integration_result }} |'
            echo '| Source consumers | ${{ needs.distribution.outputs.consumer_result }} |'
            echo '| Demo | ${{ needs.distribution.outputs.demo_result }} |'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require every suite to pass
        run: |
          test '${{ needs.quality.outputs.formatting_result }}' = success
          test '${{ needs.quality.outputs.protocol_result }}' = success
          test '${{ needs.quality.outputs.core_result }}' = success
          test '${{ needs.quality.outputs.flutter_result }}' = success
          test '${{ needs.integration.outputs.integration_result }}' = success
          test '${{ needs.distribution.outputs.consumer_result }}' = success
          test '${{ needs.distribution.outputs.demo_result }}' = success
