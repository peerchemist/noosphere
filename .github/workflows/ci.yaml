name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: noosphere
      - uses: actions/checkout@v4
        with:
          repository: peerchemist/frosty
          ref: dd921490f0cd6696328e89b18de767d87ed680a4
          path: frosty
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Install Linux desktop prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config protobuf-compiler libgtk-3-dev xvfb
      - name: Resolve workspace dependencies
        working-directory: noosphere
        run: flutter pub get
      - name: Verify protocol generation and tests
        working-directory: noosphere/packages/noosphere
        run: |
          ./tool/generate_protocol.sh --check
          dart analyze
          dart test
      - name: Analyze and unit test Flutter facade
        working-directory: noosphere
        run: |
          flutter analyze
          flutter test test
      - name: Run native Linux integration tests
        working-directory: noosphere
        run: |
          xvfb-run -a flutter test integration_test/native_transport_test.dart -d linux
          xvfb-run -a flutter test integration_test/roast_2_of_2_test.dart -d linux
      - name: Analyze and build example
        working-directory: noosphere/example
        run: |
          flutter analyze
          flutter build linux --release
      - name: Build core native test libraries
        run: |
          cargo build --locked --release --manifest-path frosty/frosty_flutter/rust/Cargo.toml
          git clone --depth 1 --branch v0.5.0 https://github.com/bitcoin-core/secp256k1.git
          cmake -S secp256k1 -B secp256k1-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/secp256k1" \
            -DSECP256K1_ENABLE_MODULE_RECOVERY=ON \
            -DSECP256K1_BUILD_TESTS=OFF \
            -DSECP256K1_BUILD_EXHAUSTIVE_TESTS=OFF \
            -DSECP256K1_BUILD_BENCHMARK=OFF
          cmake --build secp256k1-build --parallel
          cmake --install secp256k1-build
      - name: Verify client core
        working-directory: noosphere/packages/noosphere_client
        run: |
          dart analyze
          dart run iroh_quic:setup
          dart test --concurrency=1
        env:
          IROHDART_CACHE_DIR: ${{ runner.temp }}/iroh-cache
          IROH_NATIVE_LIBRARY: ${{ runner.temp }}/iroh-cache/iroh_quic/v1.0.3/x86_64-unknown-linux-gnu/libirohdart_ffi.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/frosty/frosty_flutter/rust/target/release:${{ runner.temp }}/secp256k1/lib
      - name: Verify server core
        working-directory: noosphere/packages/noosphere_server
        run: |
          dart analyze
          dart test --concurrency=1
        env:
          IROHDART_CACHE_DIR: ${{ runner.temp }}/iroh-cache
          IROH_NATIVE_LIBRARY: ${{ runner.temp }}/iroh-cache/iroh_quic/v1.0.3/x86_64-unknown-linux-gnu/libirohdart_ffi.so
          LD_LIBRARY_PATH: ${{ github.workspace }}/frosty/frosty_flutter/rust/target/release:${{ runner.temp }}/secp256k1/lib
      - name: Build server container
        working-directory: noosphere
        run: docker build --tag noosphere-server:test --file packages/noosphere_server/Dockerfile .

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: noosphere
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Resolve and analyze umbrella
        working-directory: noosphere
        run: |
          flutter pub get
          flutter analyze
          flutter test test
      - name: Run native macOS integration tests
        working-directory: noosphere
        run: |
          flutter test integration_test/native_transport_test.dart -d macos
          flutter test integration_test/roast_2_of_2_test.dart -d macos
      - name: Analyze and build example
        working-directory: noosphere/example
        run: |
          flutter analyze
          flutter build macos --release
