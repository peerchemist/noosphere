name: CI

on:
  pull_request:
  push:
    branches: [main, refactor/noosphere-monorepo]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: noosphere
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Install Linux desktop prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config protobuf-compiler libgtk-3-dev xvfb
      - name: Resolve workspace dependencies
        working-directory: noosphere
        run: flutter pub get
      - name: Verify protocol generation and tests
        working-directory: noosphere/packages/noosphere
        run: |
          ./tool/generate_protocol.sh --check
          dart analyze
          dart test
      - name: Analyze and unit test Flutter facade
        working-directory: noosphere
        run: |
          flutter analyze
          flutter test test
      - name: Run native Linux integration tests
        working-directory: noosphere
        run: |
          xvfb-run -a flutter test integration_test/native_transport_test.dart -d linux
          xvfb-run -a flutter test integration_test/roast_2_of_2_test.dart -d linux
          xvfb-run -a flutter test integration_test/worker_roast_test.dart -d linux
          xvfb-run -a flutter test integration_test/worker_lifecycle_test.dart -d linux
          xvfb-run -a flutter test integration_test/worker_room_persistence_test.dart -d linux
          xvfb-run -a flutter test integration_test/worker_pending_key_test.dart -d linux
          xvfb-run -a flutter test integration_test/worker_unexpected_exit_test.dart -d linux
          xvfb-run -a flutter test integration_test/worker_forced_shutdown_test.dart -d linux
          xvfb-run -a flutter test integration_test/worker_process_relaunch_test.dart -d linux --dart-define=NOOSPHERE_RELAUNCH_PHASE=prepare
          xvfb-run -a flutter test integration_test/worker_process_relaunch_test.dart -d linux --dart-define=NOOSPHERE_RELAUNCH_PHASE=recover
      - name: Analyze and build example
        working-directory: noosphere/example
        run: |
          flutter analyze
          flutter build linux --release
      - name: Verify client core
        working-directory: noosphere/packages/noosphere_client
        run: |
          dart analyze
          dart run iroh_quic:setup
          dart test --concurrency=1
        env:
          IROHDART_CACHE_DIR: ${{ runner.temp }}/iroh-cache
          IROH_NATIVE_LIBRARY: ${{ runner.temp }}/iroh-cache/iroh_quic/v1.0.3/x86_64-unknown-linux-gnu/libirohdart_ffi.so
      - name: Verify server core
        working-directory: noosphere/packages/noosphere_server
        run: |
          dart analyze
          dart test --concurrency=1
        env:
          IROHDART_CACHE_DIR: ${{ runner.temp }}/iroh-cache
          IROH_NATIVE_LIBRARY: ${{ runner.temp }}/iroh-cache/iroh_quic/v1.0.3/x86_64-unknown-linux-gnu/libirohdart_ffi.so
      - name: Build server container
        working-directory: noosphere
        run: docker build --tag noosphere-server:test --file packages/noosphere_server/Containerfile .

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: noosphere
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Resolve and analyze umbrella
        working-directory: noosphere
        run: |
          flutter pub get
          flutter analyze
          flutter test test
      - name: Run native macOS integration tests
        working-directory: noosphere
        run: |
          flutter test integration_test/native_transport_test.dart -d macos
          flutter test integration_test/roast_2_of_2_test.dart -d macos
          flutter test integration_test/worker_roast_test.dart -d macos
          flutter test integration_test/worker_lifecycle_test.dart -d macos
          flutter test integration_test/worker_room_persistence_test.dart -d macos
          flutter test integration_test/worker_pending_key_test.dart -d macos
          flutter test integration_test/worker_unexpected_exit_test.dart -d macos
          flutter test integration_test/worker_forced_shutdown_test.dart -d macos
          flutter test integration_test/worker_process_relaunch_test.dart -d macos --dart-define=NOOSPHERE_RELAUNCH_PHASE=prepare
          flutter test integration_test/worker_process_relaunch_test.dart -d macos --dart-define=NOOSPHERE_RELAUNCH_PHASE=recover
      - name: Analyze and build example
        working-directory: noosphere/example
        run: |
          flutter analyze
          flutter build macos --release
