name: noosphere_flutter_example
description: Linux and macOS lifecycle example for noosphere_flutter.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  noosphere_flutter:
    path: ..

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# Overrides are intentionally application-level: package overrides are not
# transitive. Keep both packages on the matching FRB 2.12 commit.
dependency_overrides:
  frosty:
    git:
      url: https://github.com/peercoin/frosty.git
      ref: dd921490f0cd6696328e89b18de767d87ed680a4
      path: frosty
  frosty_flutter:
    git:
      url: https://github.com/peercoin/frosty.git
      ref: dd921490f0cd6696328e89b18de767d87ed680a4
      path: frosty_flutter

flutter:
  uses-material-design: true
