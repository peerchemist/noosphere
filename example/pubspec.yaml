name: noosphere_flutter_example
description: Linux and macOS lifecycle example for noosphere_flutter.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  noosphere_flutter:
    path: ..

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# Overrides are intentionally application-level: package overrides are not
# transitive. Use Frosty's native-assets branch until it is published.
dependency_overrides:
  frosty:
    git:
      url: https://github.com/peerchemist/frosty.git
      ref: refactor/native-assets
      path: frosty

flutter:
  uses-material-design: true
